name: 🐞 Bug 反馈
description: 报告问津的错误或异常行为
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索已有 issue，并阅读 README 的「常见问题」。
        **安全漏洞请不要在这里提交**，请按 SECURITY.md 私下报告。
        贴日志 / 截图前请删掉 API Key、密码、邮箱、域名和 IP。
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 发生了什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 出现 …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - 直接运行 node server.js
        - systemd
        - Docker / docker compose
        - 其他
    validations:
      required: true
  - type: dropdown
    id: proxy
    attributes:
      label: 前面的代理
      options:
        - 无（直连）
        - Nginx
        - Caddy
        - Cloudflare Tunnel / CDN
        - 其他
  - type: input
    id: version
    attributes:
      label: 问津版本 / commit
      placeholder: v1.0.0 或 commit 前 7 位
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js 版本
      placeholder: node -v 的输出，Docker 部署可不填
  - type: input
    id: browser
    attributes:
      label: 浏览器与设备
      placeholder: 例如 Chrome 131 / Windows 11，Safari / iOS 18
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 服务端日志（journalctl -u wenjin 或 docker compose logs wenjin）或浏览器控制台报错
      render: text
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、渠道类型（OpenAI 兼容 / DeepSeek 官方）、是否开启联网搜索等

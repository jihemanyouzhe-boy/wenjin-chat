name: ✨ 功能建议
description: 提出新功能或改进想法
title: "[功能] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: 感谢你的想法！提交前请先搜索是否已有相同的建议。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 现在哪里不方便？谁会遇到？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你设想的方案
      description: 希望它怎么工作？可以附上草图或其他产品的参考
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 对话界面
        - 模型渠道 / 转发
        - 联网搜索
        - 智能体 / 工具
        - 账号 / 积分
        - 管理后台
        - 部署 / 文档
        - 其他
  - type: checkboxes
    id: contrib
    attributes:
      label: 参与
      options:
        - label: 我愿意提交 PR 来实现它
